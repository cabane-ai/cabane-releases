# Cabane 0.6.252, released from 8a401f6b0e4487946202fc905dcfb9e15a1c7d3b. Both of Cabane's images below are
# this release; `docker compose up -d` here pulls them. To upgrade, put the next
# release's files over these and run `docker compose pull` and `docker compose up -d`.
# Each agent turn in a container of its own, over compose.yaml:
#
#   docker compose -f compose.yaml -f compose.turns.yaml up -d
#
# The built-in runner starts a container for every turn and removes it when the
# turn ends, so two agents can't read each other's files or reach each other,
# and a turn can't reach this machine, Postgres or a private network. To do
# that it needs Docker's socket, which is control of this machine; the turns'
# containers never get it. Each turn's network leads only to the egress proxy,
# a Squid run from the companion's image (./egress.conf), which also keeps the
# model credentials and GitHub token in secrets.json out of every turn. README:
# "Each turn in a container of its own".
#
# Without this file nothing in the instance changes.

services:
  companion:
    # The socket's group, so the runner (not root) can use it:
    # `stat -c %g /var/run/docker.sock`.
    group_add:
      - '${DOCKER_GID:?set DOCKER_GID to the group of /var/run/docker.sock (stat -c %g /var/run/docker.sock)}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # The executor and its settings (the companion's README: runner.executor).
      # A turn's container runs this same image: built by compose under this name
      # here, and the release's companion image in a release's files.
      CABANE_RUNNER: >-
        {"executor":"docker","docker":{
        "image":"ghcr.io/cabane-ai/cabane-companion:0.6.252",
        "egress":"${COMPOSE_PROJECT_NAME:-cabane}-egress-1",
        "network":"${TURN_NETWORK:-closed}",
        "memoryMb":"${TURN_MEMORY_MB:-4096}",
        "cpus":"${TURN_CPUS:-2}",
        "pids":"${TURN_PIDS:-512}",
        "maxConcurrentTurns":"${MAX_CONCURRENT_TURNS:-4}",
        "cgroupParent":"${TURN_CGROUP_PARENT:-}"}}
    depends_on:
      egress:
        condition: service_started

  egress:
    # The companion's own image, which carries the OpenSSL build of Squid and
    # the lookup helper the egress proxy asks (./egress.sh, ./egress.conf).
    image: ghcr.io/cabane-ai/cabane-companion:0.6.252
    restart: unless-stopped
    mem_limit: ${EGRESS_MEMORY_LIMIT:-0}
    user: proxy
    entrypoint: ['/usr/bin/tini', '--', '/usr/local/lib/cabane/egress.sh']
    command: []
    # What the egress proxy keeps only in memory, in a tmpfs: its CA, the
    # certificates it makes, and the credential table. Never on a volume.
    tmpfs:
      - /run/cabane-egress:mode=0700,uid=13,gid=13,size=64m
    configs:
      - source: egress
        target: /etc/squid/squid.conf
      # So the directory the companion writes its rules into is there when
      # Squid first reads its configuration.
      - source: egress_rules
        target: /etc/squid/cabane/00-empty.conf
    volumes:
      - egress_log:/var/log/squid
      - egress_spool:/var/spool/squid
    # Beside the app, which turns reach through it by its name, and the internet.
    networks:
      - runner

configs:
  egress:
    file: ./egress.conf
  egress_rules:
    content: |
      # The companion writes cabane.conf beside this when it starts.

volumes:
  egress_log:
  egress_spool:
