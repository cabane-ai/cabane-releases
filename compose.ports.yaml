# Cabane 0.6.277, released from 6bc0cd5730ea45acb70d4bda590d27b7b8eece03.
# Ports a person can open on each turn's container, over compose.turns.yaml or
# compose.companion.yaml, with TURN_PORTS set in .env to a range of them:
#
#   docker compose -f compose.yaml -f compose.turns.yaml -f compose.ports.yaml up -d
#
# The egress proxy publishes the range on TURN_PORTS_BIND, an IPv4 address of
# this machine (default 127.0.0.1, this machine only; 0.0.0.0 for every one),
# and its relay passes a connection to a port on to the turn container that
# owns it. Each conversation and agent gets three of them. Whoever can reach
# that address on one can open what an agent serves there: Cabane doesn't check
# who. Set the address in .env, not here: an upgrade replaces this file. README:
# "Ports a person can open".

services:
  egress:
    environment:
      # Read by the egress proxy's start, which refuses a range holding a port it
      # listens on itself (3128, 1344) before anything listens.
      TURN_PORTS: ${TURN_PORTS:?set TURN_PORTS to a range of ports, such as 20000-20029}
    ports:
      - '${TURN_PORTS_BIND:-127.0.0.1}:${TURN_PORTS:?set TURN_PORTS to a range of ports, such as 20000-20029}:${TURN_PORTS}'
