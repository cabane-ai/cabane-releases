# The egress proxy: Squid, the one route a turn's container has off its own
# network when each turn runs in a container (README: "Each turn in a container
# of its own"). Turns reach it as http://cabane-egress:3128 and nothing else. It
# runs from the companion's image (./egress.sh), the OpenSSL build of Squid.
#
# TLS interception: it terminates the TLS a turn makes to a credential host,
# and to no other host, so it can put the real credential in place of the
# stand-in the turn holds. The certificate authority (CA) it signs those
# connections with is made when it starts, in a tmpfs, and its key never
# leaves it. Every certificate it is shown is checked against the public CAs,
# as stock Squid does: nothing here or in the companion's rules turns that off.
http_port 3128 ssl-bump tls-cert=/run/cabane-egress/ca.pem tls-key=/run/cabane-egress/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=16MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /run/cabane-egress/certificates -M 16MB
sslcrtd_children 8 startup=1 idle=1
pid_filename /run/cabane-egress/squid.pid
# It runs as an unprivileged user, which can't send the pings this is for.
pinger_enable off

# The lookup from a turn's network, the host and the stand-in it sent to the
# real credential: the companion's helper, answering from the credential table
# the companion writes into the tmpfs. Squid remembers none of its answers, so
# a turn's credentials are in force from its first request and gone with its
# turn. Asked only for a request to an intercepted host that passed every
# check below.
external_acl_type cabane_credential ttl=0 negative_ttl=0 grace=0 cache=1 children-max=16 children-startup=2 children-idle=1 %SRC %>rd %>ha{Authorization} %>ha{X-Api-Key} /usr/local/bin/node /usr/local/lib/cabane/egress-helper.js /run/cabane-egress/table.json
acl cabane_lookup external cabane_credential
acl cabane_as_bearer note cabane_scheme_ bearer
acl cabane_as_token note cabane_scheme_ token
acl cabane_as_basic note cabane_scheme_ basic
acl cabane_as_key note cabane_scheme_ key

acl cabane_step1 at_step SslBump1
acl cabane_step2 at_step SslBump2
acl cabane_encrypted connections_encrypted
acl cabane_tls_port port 443
acl CONNECT method CONNECT
# A path the refusals of credential routes could miss: an encoded dot,
# backslash or letter, or a dot segment.
acl cabane_ambiguous_path urlpath_regex -i ^[^?]*(%2e|%5c|\\|%[46][1-9a-f]|%[57][0-9a]|(/|%2f)\.\.?(/|%2f|[?]|$))

# The companion writes its rules here when it starts, ahead of the ones below:
# the credential hosts it intercepts and the swap on them, its Cabane server allowed by name
# and port, and this machine's own addresses refused. A request to the
# machine's public address never leaves the machine, so without that rule it
# would look public and pass. Not the image's own conf.d: that allows local
# networks, which here would be every turn's.
include /etc/squid/cabane/*.conf

# Every connection to a host that isn't intercepted is tunnelled untouched.
ssl_bump splice all

# Refused by the address a name actually resolves to: private, loopback,
# link-local (cloud credentials live there), shared and reserved ranges.
acl unsafe_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl unsafe_dst dst 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/3
acl unsafe_dst dst ::/128 ::1/128 ::ffff:0:0/96 fc00::/7 fe80::/10 ff00::/8 64:ff9b::/96 2001:db8::/32
acl web_ports port 80 443
acl tls_port port 443

http_access deny to_localhost
http_access deny unsafe_dst
http_access deny CONNECT !tls_port
http_access allow web_ports
http_access deny all

# A proxy, not a cache.
cache deny all
cache_mem 8 MB
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 0
coredump_dir /var/spool/squid
