# The egress proxy: Squid, which keeps credentials out of a turn's container
# when each turn runs in a container of its own (README: "Each turn in a
# container of its own"). Turns reach it as http://cabane-egress:3128; their
# other connections are forwarded as packets and never pass it
# (./egress-gateway.sh, which refuses the same addresses). It runs from the
# companion's image (./egress.sh), the OpenSSL build of Squid.
#
# TLS interception: it terminates the TLS a turn makes to a host the turn holds
# a stand-in for, and to no other host, so the real value can go in place of
# the stand-in. The certificate authority (CA) it signs those connections with
# is made when it starts, in a tmpfs, and its key never leaves it. Every
# certificate it is shown is checked against the public CAs, as stock Squid
# does: nothing here or in the companion's rules turns that off.
http_port 3128 ssl-bump tls-cert=/run/cabane-egress/ca.pem tls-key=/run/cabane-egress/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=16MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /run/cabane-egress/certificates -M 16MB
sslcrtd_children 8 startup=1 idle=1
pid_filename /run/cabane-egress/squid.pid
# It runs as an unprivileged user, which can't send the pings this is for.
pinger_enable off

acl cabane_step1 at_step SslBump1
acl cabane_step2 at_step SslBump2
acl cabane_encrypted connections_encrypted
acl cabane_tls_port port 443
acl CONNECT method CONNECT
# A path the refused routes could miss: an encoded dot, backslash or letter,
# or a dot segment.
acl cabane_ambiguous_path urlpath_regex -i ^[^?]*(%2e|%5c|\\|%[46][1-9a-f]|%[57][0-9a]|(/|%2f)\.\.?(/|%2f|[?]|$))

# Which connections are intercepted: the companion's route helper, answering
# from the table the companion writes into the tmpfs as turns start and end.
# No host is written here, so a turn starting never reloads Squid. Squid
# remembers none of its answers.
external_acl_type cabane_route ttl=0 negative_ttl=0 grace=0 cache=0 children-max=8 children-startup=2 children-idle=1 concurrency=64 %SRC %>rd %ssl::>sni %note{clt_conn_tag} /usr/local/bin/node /usr/local/lib/cabane/egress-route.js /run/cabane-egress/table.json
acl cabane_route external cabane_route
external_acl_type cabane_plain ttl=0 negative_ttl=0 grace=0 cache=0 children-max=4 children-startup=1 children-idle=1 concurrency=64 %SRC %>rd /usr/local/bin/node /usr/local/lib/cabane/egress-route.js /run/cabane-egress/table.json plain
acl cabane_plain_served external cabane_plain
# A connection the helper chose: it carries the CONNECT name as its tag.
acl cabane_bumped note clt_conn_tag

# The swap: the companion's swap service, beside Squid in this container. It
# is given each request's headers in an intercepted connection, never a body,
# and puts the real value in place of a stand-in. When it is down, those
# requests fail (`bypass=off`), and ./egress.sh stops the egress proxy.
icap_enable on
adaptation_send_client_ip on
icap_service cabane_swap reqmod_precache icap://127.0.0.1:1344/swap bypass=off
adaptation_meta X-Cabane-Connect "%note{clt_conn_tag}" cabane_bumped
adaptation_meta X-Cabane-Sni "%ssl::>sni" cabane_bumped
adaptation_access cabane_swap allow cabane_bumped cabane_encrypted cabane_tls_port
adaptation_access cabane_swap deny all

# A request in the clear, or an https:// address sent to the proxy in the
# clear, to a host the turn holds a stand-in for goes nowhere.
http_access deny !CONNECT !cabane_encrypted cabane_plain_served
http_access deny cabane_bumped cabane_ambiguous_path
# A WebSocket upgrade on an intercepted connection, which passes the same
# checks and swap as any request. Squid matches the name case-sensitively.
http_upgrade_request_protocols websocket allow cabane_bumped
http_upgrade_request_protocols WebSocket allow cabane_bumped

# The companion writes its rules here when it starts, ahead of the ones below:
# its Cabane server allowed by name and port, and this machine's own addresses
# refused. A request to the machine's public address never leaves the machine,
# so without that rule it would look public and pass. Not the image's own
# conf.d: that allows local networks, which here would be every turn's.
include /etc/squid/cabane/*.conf

# Intercepted only when the route helper says so, at both steps; every other
# connection is tunnelled untouched.
ssl_bump peek cabane_step1 cabane_route
ssl_bump splice cabane_step1
ssl_bump bump cabane_step2 cabane_route
ssl_bump splice all

# Refused by the address a name actually resolves to: private, loopback,
# link-local (cloud credentials live there), shared and reserved ranges. The
# IPv4 ones are refused to a turn's own connections too, in
# ./egress-gateway.sh: change both together.
acl unsafe_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl unsafe_dst dst 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/3
acl unsafe_dst dst ::/128 ::1/128 ::ffff:0:0/96 fc00::/7 fe80::/10 ff00::/8 64:ff9b::/96 2001:db8::/32
# Every port a turn's own connections may use, the proxy passes too, so a
# program gets the same answer whichever way it goes out: all but mail's.
acl mail_port port 25

http_access deny to_localhost
http_access deny unsafe_dst
http_access deny mail_port
http_access allow all

# A proxy, not a cache.
cache deny all
cache_mem 8 MB
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 0
coredump_dir /var/spool/squid
