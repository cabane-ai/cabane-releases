# Cabane 0.6.249, released from 3f1fccf12b0b4e48cf64e2755c08d38f8ee5067e. Both of Cabane's images below are
# this release; `docker compose up -d` here pulls them. To upgrade, put the next
# release's files over these and run `docker compose pull` and `docker compose up -d`.
# A companion on its own machine, with each agent turn in a container of its
# own, paired to a Cabane elsewhere. Two containers: the companion and the way
# out, a stock Squid every turn's network leads to (./way-out.conf). From this
# directory, with CABANE_BASE_URL set to the instance's https address:
#
#   CABANE_BASE_URL=https://cabane.example.com DOCKER_GID=$(stat -c %g /var/run/docker.sock) \
#     docker compose -f compose.companion.yaml up -d
#
# README: "Each turn in a container of its own".

name: cabane-companion

services:
  companion:
    image: ghcr.io/cabane-ai/cabane-companion:0.6.249
    restart: unless-stopped
    mem_limit: ${COMPANION_MEMORY_LIMIT:-0}
    # The device's name in the app.
    hostname: ${COMPANION_NAME:-cabane-companion}
    group_add:
      - '${DOCKER_GID:?set DOCKER_GID to the group of /var/run/docker.sock (stat -c %g /var/run/docker.sock)}'
    environment:
      CABANE_BASE_URL: ${CABANE_BASE_URL:?set CABANE_BASE_URL to the instance's https address}
      # Plain http to one host on a private network only, as for the built-in runner.
      CABANE_ALLOW_PLAIN_HTTP_HOST: ${CABANE_ALLOW_PLAIN_HTTP_HOST:-}
      CABANE_RUNNER: >-
        {"executor":"docker","docker":{
        "image":"ghcr.io/cabane-ai/cabane-companion:0.6.249",
        "wayOut":"${COMPOSE_PROJECT_NAME:-cabane-companion}-way-out-1",
        "network":"${TURN_NETWORK:-closed}",
        "memoryMb":"${TURN_MEMORY_MB:-4096}",
        "cpus":"${TURN_CPUS:-2}",
        "pids":"${TURN_PIDS:-512}",
        "turnsAtOnce":"${TURNS_AT_ONCE:-4}",
        "cgroupParent":"${TURN_CGROUP_PARENT:-}"}}
    volumes:
      - companion_home:/home/node
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      way-out:
        condition: service_started

  way-out:
    image: ubuntu/squid:latest
    restart: unless-stopped
    mem_limit: ${WAY_OUT_MEMORY_LIMIT:-0}
    configs:
      - source: way_out
        target: /etc/squid/squid.conf
      # So the directory the companion writes its rules into is there when
      # Squid first reads its configuration.
      - source: way_out_rules
        target: /etc/squid/cabane/until-the-companion-starts.conf
    volumes:
      - way_out_log:/var/log/squid
      - way_out_spool:/var/spool/squid

configs:
  way_out:
    file: ./way-out.conf
  way_out_rules:
    content: |
      # The companion writes cabane.conf beside this when it starts.

volumes:
  companion_home:
  way_out_log:
  way_out_spool:
