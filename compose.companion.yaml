# Cabane 0.6.263, released from 09e4c8cfc64cc16ab08f4d08172a0856b7ccff36. Cabane's images below are this
# release; `docker compose up -d` here pulls them. To upgrade, put the next
# release's files over these and run `docker compose pull` and `docker compose up -d`.
# RUNNER_IMAGE in .env names an image of your own, built on this release's
# runner image, in its place (README: Adding tools for agents).
# A companion on its own machine, with each agent turn in a container of its
# own, paired to a Cabane elsewhere. Two containers from one image: the
# companion and the egress proxy, the Squid every turn's network leads to
# (./egress.conf). From this
# directory, with CABANE_BASE_URL set to the instance's https address:
#
#   CABANE_BASE_URL=https://cabane.example.com DOCKER_GID=$(stat -c %g /var/run/docker.sock) \
#     docker compose -f compose.companion.yaml up -d
#
# README: "Each turn in a container of its own".

name: cabane-companion

services:
  companion:
    image: ${RUNNER_IMAGE:-ghcr.io/cabane-ai/cabane-companion:0.6.263}
    restart: unless-stopped
    mem_limit: ${COMPANION_MEMORY_LIMIT:-0}
    # The device's name in the app.
    hostname: ${COMPANION_NAME:-cabane-companion}
    group_add:
      - '${DOCKER_GID:?set DOCKER_GID to the group of /var/run/docker.sock (stat -c %g /var/run/docker.sock)}'
    environment:
      CABANE_BASE_URL: ${CABANE_BASE_URL:?set CABANE_BASE_URL to the instance's https address}
      # Plain http to one host on a private network only, as for the built-in runner.
      CABANE_ALLOW_PLAIN_HTTP_HOST: ${CABANE_ALLOW_PLAIN_HTTP_HOST:-}
      CABANE_RUNNER: >-
        {"executor":"docker","docker":{
        "image":"${RUNNER_IMAGE:-ghcr.io/cabane-ai/cabane-companion:0.6.263}",
        "egress":"${COMPOSE_PROJECT_NAME:-cabane-companion}-egress-1",
        "network":"${TURN_NETWORK:-closed}",
        "memoryMb":"${TURN_MEMORY_MB:-4096}",
        "cpus":"${TURN_CPUS:-2}",
        "pids":"${TURN_PIDS:-512}",
        "maxConcurrentTurns":"${MAX_CONCURRENT_TURNS:-4}",
        "minFreeDiskGb":"${MIN_FREE_DISK_GB:-}",
        "homeIdleHours":"${HOME_IDLE_HOURS:-24}",
        "ports":"${TURN_PORTS:-}",
        "portsHost":"${TURN_PORTS_HOST:-}",
        "portsIdleMinutes":"${TURN_PORTS_IDLE_MINUTES:-30}",
        "cgroupParent":"${TURN_CGROUP_PARENT:-}"}}
    volumes:
      - companion_home:/home/node
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      egress:
        condition: service_started

  egress:
    # The companion's own image, which carries the OpenSSL build of Squid and
    # the lookup helper the egress proxy asks (./egress.sh, ./egress.conf).
    image: ${RUNNER_IMAGE:-ghcr.io/cabane-ai/cabane-companion:0.6.263}
    restart: unless-stopped
    mem_limit: ${EGRESS_MEMORY_LIMIT:-0}
    user: proxy
    entrypoint: ['/usr/bin/tini', '--', '/usr/local/lib/cabane/egress.sh']
    command: []
    # What the egress proxy keeps only in memory, in a tmpfs: its CA, the
    # certificates it makes, and the credential table. Never on a volume.
    tmpfs:
      - /run/cabane-egress:mode=0700,uid=13,gid=13,size=64m
    configs:
      - source: egress
        target: /etc/squid/squid.conf
      # So the directory the companion writes its rules into is there when
      # Squid first reads its configuration.
      - source: egress_rules
        target: /etc/squid/cabane/00-empty.conf
    volumes:
      - egress_log:/var/log/squid
      - egress_spool:/var/spool/squid

configs:
  egress:
    file: ./egress.conf
  egress_rules:
    content: |
      # The companion writes cabane.conf beside this when it starts.

volumes:
  companion_home:
  egress_log:
  egress_spool:
